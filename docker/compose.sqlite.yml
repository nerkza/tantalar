# One-command SQLite deployment (default). Data lives in the `tantalar-data`
# volume; the server listens on host port 8790.
services:
  tantalar:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TANTALAR_BUILD_VERSION: ${TANTALAR_IMAGE_TAG:-0.0.1-alpha.0}
        TANTALAR_BUILD_REVISION: ${TANTALAR_BUILD_REVISION:-}
        TANTALAR_BUILD_DATE: ${TANTALAR_BUILD_DATE:-}
    image: tantalar:${TANTALAR_IMAGE_TAG:-0.0.1-alpha.0}
    ports:
      - "8790:8790"
    volumes:
      - tantalar-data:/data
    restart: unless-stopped

volumes:
  tantalar-data:
