# One-command SQLite deployment (default). Data lives in the `tantalar-data`
# volume; the server listens on host port 8787.
services:
  tantalar:
    build: .
    image: tantalar:v1
    ports:
      - "8787:8787"
    volumes:
      - tantalar-data:/data
    restart: unless-stopped

volumes:
  tantalar-data:
