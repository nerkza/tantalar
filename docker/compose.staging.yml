name: tantalar-staging

services:
  tantalar:
    image: ${TANTALAR_STAGING_IMAGE:?set TANTALAR_STAGING_IMAGE to the tested image digest}
    ports:
      - "127.0.0.1:8791:8790"
    volumes:
      - staging-data:/data
      - ./staging.yaml:/config/tantalar.yaml:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    network_mode: host
    user: "65532:65532"
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel-token
    secrets:
      - tunnel-token
    restart: unless-stopped

secrets:
  tunnel-token:
    file: /srv/tantalar-staging/secrets/tunnel-token

volumes:
  staging-data:
