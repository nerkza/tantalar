name: Metadata staging

on:
  workflow_call:
  pull_request:
    paths:
      - apps/metadata-gateway/**
      - tests/metadata-gateway.test.ts
      - .github/workflows/metadata-staging.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tantalar/metadata-gateway typecheck
      - run: pnpm --filter @tantalar/metadata-gateway exec wrangler deploy --env staging --dry-run
      - run: pnpm exec vitest run tests/metadata-gateway.test.ts

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: metadata-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy current staging commit
        run: |
          git fetch --no-tags origin staging
          if [ "$(git rev-parse origin/staging)" = "$GITHUB_SHA" ]; then
            pnpm --filter @tantalar/metadata-gateway exec wrangler deploy --env staging
            node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://metadata-staging.tantalar.app/v1/tmdb/configuration', {
            signal: AbortSignal.timeout(30000),
          });
          assert.equal(response.status, 200, 'Staging metadata request failed');
          const data = await response.json();
          assert.ok(data.images?.secure_base_url, 'TMDB configuration is missing');
          JS
          else
            echo "A newer staging commit exists; skipping deployment."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
