name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: External media tools for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends par2 ffmpeg xz-utils
          node scripts/install-test-7zip.mjs

      - name: Release version consistency
        run: pnpm run version:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Lint gate: no repo-wide ESLint config yet; enforce the checks that
      # exist today (format drift guard placeholder until a linter lands).
      - name: Lint
        run: |
          test -f .eslintrc* || test -f eslint.config.* || \
            echo "no eslint config — typecheck is the lint gate for now"

      - name: Test (SQLite)
        run: pnpm exec vitest run --no-file-parallelism

      - name: Test (web)
        run: pnpm --filter @tantalar/web test --no-file-parallelism

      - name: Postgres
        run: |
          sudo systemctl start postgresql@16-main || sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';" -c "CREATE DATABASE tantalar_ci;"

      - name: Migrations on PostgreSQL
        run: pnpm exec vitest run --no-file-parallelism
        env:
          TANTALAR_CI_POSTGRES: "1"

      - name: Plugin conformance
        run: pnpm exec vitest run tests/phase2-lifecycle-conformance.test.ts

      - name: Browser smoke tests (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          pnpm exec playwright install --with-deps chromium
          TANTALAR_E2E_FFMPEG=ffmpeg pnpm exec playwright test e2e/viewer.spec.ts --workers=1 --grep 'viewer sign-in|library browsing|direct play:'

      - name: Playwright (main and pull requests)
        if: github.ref != 'refs/heads/staging'
        run: |
          pnpm exec playwright install --with-deps chromium
          TANTALAR_E2E_FFMPEG=ffmpeg pnpm exec playwright test --workers=1

  browser-staging:
    # Report the full suite separately; staging deployment requires the smoke tests above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full browser suite (does not gate staging)
        run: TANTALAR_E2E_FFMPEG=ffmpeg pnpm exec playwright test --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: staging-browser-failures
          path: test-results/
          retention-days: 7

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ADR-016: GPL/AGPL must not enter core artifacts. Generates SBOM +
      # license reports as CI artifacts and fails on GPL-family licenses.
      - name: SBOM + license report (fail on GPL)
        run: ./scripts/generate-sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-licenses
          path: artifacts/

  docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    outputs:
      staging-image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build metadata
        id: build-metadata
        run: echo "built-at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          docker build \
            --build-arg TANTALAR_BUILD_VERSION="$(node scripts/version.mjs show version)" \
            --build-arg TANTALAR_BUILD_REVISION="$GITHUB_SHA" \
            --build-arg TANTALAR_BUILD_DATE="${{ steps.build-metadata.outputs.built-at }}" \
            -t tantalar:ci .
      - name: Smoke boot (SQLite)
        run: |
          docker run -d --name tantalar-smoke -p 8790:8790 tantalar:ci
          expected="$(node scripts/version.mjs show version)"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/healthz | grep -q "\"version\":\"$expected\""; then
              echo "smoke boot OK"; exit 0
            fi
            sleep 2
          done
          echo "smoke boot failed" >&2
          docker logs tantalar-smoke >&2 || true
          exit 1
      - name: Stop smoke container
        if: always()
        run: docker rm -f tantalar-smoke || true
      - name: Publish tested staging image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/nerkza/tantalar:staging-$GITHUB_SHA"
          docker tag tantalar:ci "$image"
          docker push "$image"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"

  metadata-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [check, licenses, vulnerability-scan]
    uses: ./.github/workflows/metadata-staging.yml

  app-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [docker, metadata-staging]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    concurrency:
      group: application-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy current staging commit to VPS
        env:
          STAGING_IMAGE: ${{ needs.docker.outputs.staging-image }}
          SSH_HOST: ${{ vars.TANTALAR_STAGING_SSH_HOST }}
          SSH_USER: ${{ vars.TANTALAR_STAGING_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.TANTALAR_STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TANTALAR_STAGING_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TANTALAR_STAGING_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TANTALAR_STAGING_ACCESS_CLIENT_SECRET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          if [ "$(git rev-parse origin/staging)" != "$GITHUB_SHA" ]; then
            echo "A newer staging commit exists; skipping deployment."
            exit 0
          fi
          : "${SSH_HOST:?set the staging SSH host}" "${SSH_USER:?set the staging SSH user}"
          : "${SSH_PRIVATE_KEY:?set the deployment key}" "${SSH_KNOWN_HOSTS:?pin the VPS host key}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          docker pull cloudflare/cloudflared:2026.8.3
          printf 'Host %s\n  ProxyCommand docker run --rm -i -e TUNNEL_SERVICE_TOKEN_ID -e TUNNEL_SERVICE_TOKEN_SECRET cloudflare/cloudflared:2026.8.3 access ssh --hostname %%h\n' "$SSH_HOST" > ~/.ssh/config
          target="$SSH_USER@$SSH_HOST"
          release="/srv/tantalar-staging/releases/$GITHUB_SHA"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p '$release'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes docker/compose.staging.yml docker/staging.yaml scripts/deploy-staging.sh "$target:$release/"
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "cd '$release' && sh deploy-staging.sh '$STAGING_IMAGE' '$GITHUB_SHA' '$GITHUB_ACTOR'"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and above fail)
        run: pnpm audit --prod --audit-level high
