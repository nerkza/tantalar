name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Lint gate: no repo-wide ESLint config yet; enforce the checks that
      # exist today (format drift guard placeholder until a linter lands).
      - name: Lint
        run: |
          test -f .eslintrc* || test -f eslint.config.* || \
            echo "no eslint config — typecheck is the lint gate for now"

      - name: Test (SQLite)
        run: pnpm test

      - name: Postgres
        run: |
          sudo systemctl start postgresql@16-main || sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';" -c "CREATE DATABASE tantalar_ci;"

      - name: Migrations on PostgreSQL
        run: pnpm test
        env:
          TANTALAR_CI_POSTGRES: "1"

      - name: Plugin conformance
        run: pnpm exec vitest run tests/phase2-lifecycle-conformance.test.ts

      - name: Playwright
        run: |
          pnpm exec playwright install --with-deps chromium || sudo apt-get update && sudo apt-get install -y chromium ffmpeg
          TANTALAR_E2E_FFMPEG=ffmpeg pnpm exec playwright test

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ADR-016: GPL/AGPL must not enter core artifacts. Generates SBOM +
      # license reports as CI artifacts and fails on GPL-family licenses.
      - name: SBOM + license report (fail on GPL)
        run: ./scripts/generate-sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-licenses
          path: artifacts/

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tantalar:ci .
      - name: Smoke boot (SQLite)
        run: |
          docker run -d --name tantalar-smoke -p 8787:8787 tantalar:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz | grep -q '"ok":true'; then
              echo "smoke boot OK"; exit 0
            fi
            sleep 2
          done
          echo "smoke boot failed" >&2
          docker logs tantalar-smoke >&2 || true
          exit 1
      - name: Stop smoke container
        if: always()
        run: docker rm -f tantalar-smoke || true

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and above fail)
        run: pnpm audit --prod --audit-level high
